<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141118"/>
      <stop offset="100%" stop-color="#0a080d"/>
    </linearGradient>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="secCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1824"/>
      <stop offset="100%" stop-color="#130f18"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="440" rx="12" fill="url(#secBg)"/>
  <rect width="698" height="438" x="1" y="1" rx="11" fill="none" stroke="#2c2236" stroke-width="1"/>

  <!-- Top Window Bar -->
  <rect width="700" height="42" rx="12" fill="#181320"/>
  <rect y="30" width="700" height="12" fill="#181320"/>
  <line x1="0" y1="42" x2="700" y2="42" stroke="#2a2034" stroke-width="1"/>
  
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>

  <text x="80" y="25" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="1">DIGITAL IMAGE FORGERY &amp; FORENSICS SYSTEM</text>
  <rect x="520" y="12" width="155" height="18" rx="9" fill="rgba(239,68,68,0.18)"/>
  <text x="597" y="25" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">TAMPER DETECTION ENGINE</text>

  <!-- Left: Visual Comparison Split (Original vs ELA Analysis) -->
  <rect x="24" y="60" width="370" height="250" rx="8" fill="#0d0a12" stroke="#2a2036" stroke-width="1"/>
  
  <!-- Left Half: Original Image simulation -->
  <rect x="36" y="80" width="160" height="180" rx="6" fill="#1a1524" stroke="#372d47" stroke-width="1"/>
  <circle cx="116" cy="140" r="32" fill="#4c1d95" opacity="0.6"/>
  <rect x="66" y="180" width="100" height="40" rx="4" fill="#581c87" opacity="0.5"/>
  <text x="116" y="278" fill="#a855f7" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Input Source Image</text>

  <!-- Right Half: ELA Tamper Heatmap -->
  <rect x="218" y="80" width="160" height="180" rx="6" fill="#0a0510" stroke="#ef4444" stroke-width="1"/>
  <!-- Noise Grid -->
  <circle cx="298" cy="140" r="32" fill="url(#heatGrad)" opacity="0.8"/>
  <rect x="258" y="180" width="80" height="40" rx="4" fill="#ef4444" opacity="0.85"/>
  <rect x="250" y="172" width="96" height="56" rx="4" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="298" y="278" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ELA Tamper Map (Flagged)</text>

  <!-- Right: Forensic Analysis Console -->
  <rect x="410" y="60" width="266" height="250" rx="8" fill="url(#secCard)" stroke="#2b2138" stroke-width="1"/>
  <text x="426" y="86" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Forensics Diagnostic</text>
  <text x="426" y="103" fill="#a855f7" font-family="sans-serif" font-size="10">Pixel Discontinuity &amp; Metadata Analysis</text>

  <!-- Diagnostic Metrics -->
  <rect x="426" y="118" width="234" height="48" rx="6" fill="#0e0a14" stroke="#251c30" stroke-width="1"/>
  <text x="438" y="138" fill="#f87171" font-family="sans-serif" font-size="15" font-weight="800">98.4% CONFIDENCE</text>
  <text x="438" y="154" fill="#9ca3af" font-family="sans-serif" font-size="9">Copy-Move Splicing Detected</text>

  <rect x="426" y="174" width="234" height="56" rx="6" fill="#0e0a14" stroke="#251c30" stroke-width="1"/>
  <text x="438" y="192" fill="#e9d5ff" font-family="sans-serif" font-size="10" font-weight="700">Error Level Variance:</text>
  <!-- Mini progress indicator -->
  <rect x="438" y="200" width="208" height="6" rx="3" fill="#2d213b"/>
  <rect x="438" y="200" width="180" height="6" rx="3" fill="url(#heatGrad)"/>
  <text x="438" y="220" fill="#9ca3af" font-family="sans-serif" font-size="8">High JPEG compression delta in ROI</text>

  <rect x="426" y="238" width="234" height="58" rx="6" fill="#0e0a14" stroke="#251c30" stroke-width="1"/>
  <text x="438" y="256" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700">Metadata Inconsistency:</text>
  <text x="438" y="272" fill="#9ca3af" font-family="sans-serif" font-size="9">EXIF mismatch with quantization table</text>
  <text x="438" y="286" fill="#4ade80" font-family="sans-serif" font-size="8">✓ Forensic Audit Report Exported</text>

  <!-- Bottom Architecture Bar -->
  <rect x="24" y="326" width="652" height="88" rx="8" fill="#120e1a" stroke="#231a30" stroke-width="1"/>
  <text x="42" y="352" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">ALGORITHMS &amp; FORENSIC TOOLKIT</text>
  
  <rect x="42" y="366" width="116" height="32" rx="4" fill="#1b1526" stroke="#33254a" stroke-width="1"/>
  <text x="100" y="386" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python / CV</text>

  <rect x="168" y="366" width="116" height="32" rx="4" fill="#1b1526" stroke="#33254a" stroke-width="1"/>
  <text x="226" y="386" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">ELA Pipeline</text>

  <rect x="294" y="366" width="116" height="32" rx="4" fill="#1b1526" stroke="#33254a" stroke-width="1"/>
  <text x="352" y="386" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Noise Variance</text>

  <rect x="420" y="366" width="116" height="32" rx="4" fill="#1b1526" stroke="#33254a" stroke-width="1"/>
  <text x="478" y="386" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Keypoint Match</text>

  <rect x="546" y="366" width="116" height="32" rx="4" fill="#1b1526" stroke="#33254a" stroke-width="1"/>
  <text x="604" y="386" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Audit Export</text>
</svg>
