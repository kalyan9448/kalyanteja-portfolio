  </defs>

  <!-- Background -->
  <rect width="700" height="440" rx="12" fill="url(#saasBg)"/>
  <rect width="698" height="438" x="1" y="1" rx="11" fill="none" stroke="#222c3c" stroke-width="1"/>

  <!-- Top Window Bar -->
  <rect width="700" height="42" rx="12" fill="#141a24"/>
