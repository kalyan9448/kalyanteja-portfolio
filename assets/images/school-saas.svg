  <text x="434" y="236" fill="#64748b" font-family="sans-serif" font-size="9">Adaptive difficulty based on quiz scores</text>

  <rect x="424" y="254" width="238" height="42" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1"/>
  <text x="543" y="278" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Multi-Tenant RBAC Active</text>

