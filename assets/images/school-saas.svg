  <rect x="168" y="366" width="116" height="32" rx="4" fill="#18202d" stroke="#283548" stroke-width="1"/>
  <text x="226" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">React.js Web</text>

  <rect x="294" y="366" width="116" height="32" rx="4" fill="#18202d" stroke="#283548" stroke-width="1"/>
  <text x="352" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Node.js API</text>

  <rect x="420" y="366" width="116" height="32" rx="4" fill="#18202d" stroke="#283548" stroke-width="1"/>
  <text x="478" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Firebase Sync</text>

  <rect x="546" y="366" width="116" height="32" rx="4" fill="#18202d" stroke="#283548" stroke-width="1"/>
  <text x="604" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tailwind CSS</text>
