  <text x="478" y="152" fill="#888899" font-family="sans-serif" font-size="9">Automated Slots &amp; Rituals</text>

  <rect x="466" y="170" width="194" height="44" rx="6" fill="#12121a" stroke="#252538" stroke-width="1"/>
  <text x="478" y="188" fill="#68d391" font-family="sans-serif" font-size="11" font-weight="700">Razorpay Secured</text>
  <text x="478" y="204" fill="#888899" font-family="sans-serif" font-size="9">Webhook Verified Payments</text>

  <rect x="466" y="222" width="194" height="44" rx="6" fill="#12121a" stroke="#252538" stroke-width="1"/>
  <text x="478" y="240" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">Shiprocket Dispatched</text>
  <text x="478" y="256" fill="#888899" font-family="sans-serif" font-size="9">Automated Prasadam Tracking</text>

  <!-- Bottom Badges / Tech Strip -->
  <rect x="24" y="326" width="652" height="88" rx="8" fill="#14141d" stroke="#232333" stroke-width="1"/>
  <text x="42" y="352" fill="#d4b892" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">INTEGRATED ARCHITECTURE</text>
  
  <rect x="42" y="366" width="110" height="32" rx="4" fill="#1d1d2b" stroke="#313147" stroke-width="1"/>
  <text x="97" y="386" fill="#e8e4df" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">React Native</text>

  <rect x="162" y="366" width="110" height="32" rx="4" fill="#1d1d2b" stroke="#313147" stroke-width="1"/>
  <text x="217" y="386" fill="#e8e4df" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Agora WebRTC</text>

  <rect x="282" y="366" width="110" height="32" rx="4" fill="#1d1d2b" stroke="#313147" stroke-width="1"/>
  <text x="337" y="386" fill="#e8e4df" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Razorpay API</text>

  <rect x="402" y="366" width="110" height="32" rx="4" fill="#1d1d2b" stroke="#313147" stroke-width="1"/>
  <text x="457" y="386" fill="#e8e4df" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Shiprocket API</text>

  <rect x="522" y="366" width="138" height="32" rx="4" fill="#1d1d2b" stroke="#313147" stroke-width="1"/>
  <text x="591" y="386" fill="#e8e4df" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Firebase Firestore</text>
</svg>
