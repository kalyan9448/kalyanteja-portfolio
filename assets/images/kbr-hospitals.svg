<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1816"/>
      <stop offset="100%" stop-color="#080e0d"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="medCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142421"/>
      <stop offset="100%" stop-color="#0e1a17"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="440" rx="12" fill="url(#medBg)"/>
  <rect width="698" height="438" x="1" y="1" rx="11" fill="none" stroke="#1d332d" stroke-width="1"/>

  <!-- Top Window Bar -->
  <rect width="700" height="42" rx="12" fill="#11211d"/>
  <rect y="30" width="700" height="12" fill="#11211d"/>
  <line x1="0" y1="42" x2="700" y2="42" stroke="#1c332d" stroke-width="1"/>
  
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>

  <text x="80" y="25" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="1">KBR HOSPITALS — PRODUCTION MOBILE APPLICATION</text>
  <rect x="520" y="12" width="155" height="18" rx="9" fill="rgba(16,185,129,0.18)"/>
  <text x="597" y="25" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">GOOGLE PLAY STORE LIVE</text>

  <!-- Mobile Phone Mockup (Center Left) -->
  <rect x="50" y="56" width="180" height="260" rx="20" fill="#090d0c" stroke="url(#phoneBorder)" stroke-width="3"/>
  <rect x="110" y="62" width="60" height="8" rx="4" fill="#1e293b"/> <!-- Notch -->
  
  <!-- Inside Phone Screen -->
  <rect x="58" y="74" width="164" height="232" rx="12" fill="#0f1917"/>
  <text x="70" y="94" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">KBR Hospitals</text>
  <text x="70" y="106" fill="#6ee7b7" font-family="sans-serif" font-size="8">Book Appointment</text>

  <!-- Doctor Card Inside Phone -->
  <rect x="68" y="116" width="144" height="42" rx="6" fill="#162924"/>
  <circle cx="84" cy="137" r="10" fill="#10b981"/>
  <text x="84" y="141" fill="#ffffff" font-size="9" text-anchor="middle">👨‍⚕️</text>
  <text x="100" y="132" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Dr. Rajesh V.</text>
  <text x="100" y="144" fill="#9ca3af" font-family="sans-serif" font-size="7">Cardiologist (12 yrs)</text>

  <!-- Slot Chips inside Phone -->
  <text x="70" y="174" fill="#d1d5db" font-family="sans-serif" font-size="8" font-weight="600">Available Slots (Today)</text>
  <rect x="68" y="182" width="44" height="16" rx="3" fill="#162924"/>
  <text x="90" y="193" fill="#9ca3af" font-size="7" text-anchor="middle">10:00 AM</text>

  <rect x="116" y="182" width="44" height="16" rx="3" fill="#10b981"/>
  <text x="138" y="193" fill="#000000" font-size="7" font-weight="700" text-anchor="middle">11:30 AM</text>

  <rect x="164" y="182" width="44" height="16" rx="3" fill="#162924"/>
  <text x="186" y="193" fill="#9ca3af" font-size="7" text-anchor="middle">02:00 PM</text>

  <!-- Button Inside Phone -->
  <rect x="68" y="212" width="144" height="24" rx="4" fill="#10b981"/>
  <text x="140" y="227" fill="#064e3b" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">CONFIRM &amp; NOTIFY</text>

  <!-- Status pill inside phone -->
  <rect x="68" y="244" width="144" height="18" rx="3" fill="rgba(16,185,129,0.1)"/>
  <text x="140" y="256" fill="#34d399" font-size="7" text-anchor="middle">✓ Instant SMS &amp; Token Sent</text>

  <!-- Right Dashboard / Analytics Panel -->
  <rect x="256" y="60" width="420" height="250" rx="8" fill="url(#medCard)" stroke="#1d332d" stroke-width="1"/>
  <text x="276" y="86" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Healthcare Operational Architecture</text>
  <text x="276" y="103" fill="#6ee7b7" font-family="sans-serif" font-size="10">High-Concurrency Slot Reservation &amp; Live Tracking</text>

  <!-- Key Metrics Row -->
  <rect x="276" y="118" width="186" height="56" rx="6" fill="#0c1714" stroke="#1b302a" stroke-width="1"/>
  <text x="290" y="140" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="800">20% FASTER</text>
  <text x="290" y="160" fill="#94a3b8" font-family="sans-serif" font-size="9">Appointment Scheduling Time</text>

  <rect x="472" y="118" width="184" height="56" rx="6" fill="#0c1714" stroke="#1b302a" stroke-width="1"/>
  <text x="486" y="140" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800">0% COLLISION</text>
  <text x="486" y="160" fill="#94a3b8" font-family="sans-serif" font-size="9">Atomic Transaction Safe</text>

  <!-- Workflow Description Box -->
  <rect x="276" y="188" width="380" height="106" rx="6" fill="#0c1714" stroke="#1b302a" stroke-width="1"/>
  <text x="292" y="210" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="700">System Highlights:</text>
  <text x="292" y="230" fill="#a7f3d0" font-family="sans-serif" font-size="10">• Real-time Firestore slot synchronization across web &amp; mobile.</text>
  <text x="292" y="248" fill="#a7f3d0" font-family="sans-serif" font-size="10">• Production deployment to Google Play Store with automated signing.</text>
  <text x="292" y="266" fill="#a7f3d0" font-family="sans-serif" font-size="10">• Doctor availability state caching for near-zero network latency.</text>

  <!-- Bottom Architecture Bar -->
  <rect x="24" y="326" width="652" height="88" rx="8" fill="#0d1a17" stroke="#19302a" stroke-width="1"/>
  <text x="42" y="352" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">MOBILE &amp; BACKEND TECHNOLOGIES</text>
  
  <rect x="42" y="366" width="116" height="32" rx="4" fill="#142823" stroke="#23423a" stroke-width="1"/>
  <text x="100" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">React Native</text>

  <rect x="168" y="366" width="116" height="32" rx="4" fill="#142823" stroke="#23423a" stroke-width="1"/>
  <text x="226" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Google Play</text>

  <rect x="294" y="366" width="116" height="32" rx="4" fill="#142823" stroke="#23423a" stroke-width="1"/>
  <text x="352" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Node.js REST</text>

  <rect x="420" y="366" width="116" height="32" rx="4" fill="#142823" stroke="#23423a" stroke-width="1"/>
  <text x="478" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Firebase Sync</text>

  <rect x="546" y="366" width="116" height="32" rx="4" fill="#142823" stroke="#23423a" stroke-width="1"/>
  <text x="604" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Atomic DB</text>
</svg>
